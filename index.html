
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You Container</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 15px;
    background: #f4f6f9;
    font-family: Arial, Helvetica, sans-serif;
    color: #333;
}

.container {
    width: 100%;
    max-width: 650px;
    margin: 0 auto;
    padding: 30px 25px;
    background: #ffffff;
    border: 1px solid #e8e8e8;
    border-radius: 14px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    text-align: center;
}

.thank-title {
    margin: 0 0 10px;
    font-size: 30px;
    color: #252525;
    font-weight: 700;
}

.subtitle {
    margin: 0 0 22px;
    color: #666666;
    font-size: 15px;
    line-height: 1.6;
}

.gif-container {
    width: 100%;
    margin: 0 auto 22px;
}

.gif-container img {
    display: block;
    width: 100%;
    max-width: 300px;
    max-height: 240px;
    object-fit: contain;
    margin: 0 auto;
    border-radius: 8px;
}

.highlight {
    padding: 15px 18px;
    background: #fff0cc;
    border-left: 4px solid #d49a24;
    border-radius: 6px;
    color: #754600;
    font-size: 16px;
    font-weight: bold;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.editor {
    width: 100%;
    max-width: 650px;
    margin: 25px auto 0;
    padding: 22px;
    background: #ffffff;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
}

.editor h3 {
    margin: 0 0 18px;
    font-size: 18px;
}

label {
    display: block;
    margin: 14px 0 7px;
    font-size: 13px;
    font-weight: bold;
}

input, textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #cccccc;
    border-radius: 6px;
    font-family: Arial, sans-serif;
    font-size: 14px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

button {
    margin: 14px 7px 0 0;
    padding: 11px 17px;
    border: none;
    border-radius: 6px;
    background: #252525;
    color: #ffffff;
    font-size: 14px;
    cursor: pointer;
}

button:hover {
    background: #444444;
}

.secondary-button {
    background: #e9e9e9;
    color: #333333;
}

.secondary-button:hover {
    background: #d9d9d9;
}

.note {
    margin-top: 15px;
    color: #777777;
    font-size: 12px;
    line-height: 1.6;
}

@media (max-width: 480px) {
    body {
        padding: 15px 10px;
    }

    .container {
        padding: 24px 16px;
    }

    .thank-title {
        font-size: 25px;
    }

    .highlight {
        font-size: 14px;
    }

    .editor {
        padding: 16px;
    }
}
</style>
</head>

<body>

<!-- THANK YOU CONTAINER -->
<div class="container" id="thankYouContainer">

    <h1 class="thank-title">Thank You!</h1>

    <p class="subtitle">
        We truly appreciate your time and support.
    </p>

    <div class="gif-container">
        <img
            id="thankYouGif"
            src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZGphbnFrZW1lZWlkMWoxNGtzbHFtYnJmYmt2azQyeW1wa2p5N2FmdyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/GDCAFspPmVBGBVOmjc/giphy.gif"
            alt="Thank You Animation"
        >
    </div>

    <div class="highlight" id="highlightText">
        YOUR HIGHLIGHTED TEXT GOES HERE
    </div>

</div>

<!-- LIVE EDITOR -->
<div class="editor">

    <h3>Customize Your Container</h3>

    <label for="gifUrl">GIF URL</label>
    <input
        type="url"
        id="gifUrl"
        placeholder="Paste your direct GIF URL here"
        value="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZGphbnFrZW1lZWlkMWoxNGtzbHFtYnJmYmt2azQyeW1wa2p5N2FmdyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/GDCAFspPmVBGBVOmjc/giphy.gif"
    >

    <label for="customText">Highlighted Text</label>
    <textarea id="customText">YOUR HIGHLIGHTED TEXT GOES HERE</textarea>

    <label for="headingText">Heading</label>
    <input
        type="text"
        id="headingText"
        value="Thank You!"
    >

    <button type="button" id="copyButton">
        Copy HTML
    </button>

    <button type="button" class="secondary-button" id="resetButton">
        Reset
    </button>

    <p class="note">
        Changes appear automatically above. For email use, the GIF
        must be hosted at a publicly accessible URL. Some email clients
        may block images or show only the first GIF frame.
    </p>

    <p id="status" role="status" aria-live="polite"></p>

</div>

<script>
const gifUrlInput = document.getElementById("gifUrl");
const customTextInput = document.getElementById("customText");
const headingInput = document.getElementById("headingText");

const gifImage = document.getElementById("thankYouGif");
const highlightText = document.getElementById("highlightText");
const heading = document.querySelector(".thank-title");

const copyButton = document.getElementById("copyButton");
const resetButton = document.getElementById("resetButton");
const status = document.getElementById("status");

const defaultGif =
    "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZGphbnFrZW1lZWlkMWoxNGtzbHFtYnJmYmt2azQyeW1wa2p5N2FmdyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/GDCAFspPmVBGBVOmjc/giphy.gif";

function updatePreview() {
    heading.textContent = headingInput.value || "Thank You!";
    highlightText.textContent =
        customTextInput.value || "YOUR HIGHLIGHTED TEXT GOES HERE";

    const url = gifUrlInput.value.trim();

    if (url) {
        try {
            const parsedUrl = new URL(url);

            if (parsedUrl.protocol === "https:" ||
                parsedUrl.protocol === "http:") {
                gifImage.src = parsedUrl.href;
                gifImage.style.display = "block";
                status.textContent = "";
            } else {
                gifImage.style.display = "none";
                status.textContent = "Please enter a valid HTTP or HTTPS URL.";
            }
        } catch {
            gifImage.style.display = "none";
            status.textContent = "Please enter a valid GIF URL.";
        }
    } else {
        gifImage.style.display = "none";
        status.textContent = "Enter a GIF URL to display the animation.";
    }
}

gifUrlInput.addEventListener("input", updatePreview);
customTextInput.addEventListener("input", updatePreview);
headingInput.addEventListener("input", updatePreview);

copyButton.addEventListener("click", async function () {
    const safeGifUrl = gifUrlInput.value.trim();
    const safeHeading = headingInput.value || "Thank You!";
    const safeText = customTextInput.value ||
        "YOUR HIGHLIGHTED TEXT GOES HERE";

    const html = `
<div style="max-width:600px;margin:20px auto;padding:25px;
text-align:center;font-family:Arial,Helvetica,sans-serif;
border:1px solid #eeeeee;border-radius:12px;background:#ffffff;">
  <h2 style="margin:0 0 10px;color:#252525;">
    ${escapeHTML(safeHeading)}
  </h2>
  <p style="margin:0 0 20px;color:#666666;font-size:14px;">
    We truly appreciate your time and support.
  </p>
  <img src="${escapeAttribute(safeGifUrl)}"
       alt="Thank You Animation"
       style="display:block;width:100%;max-width:300px;height:auto;
       margin:0 auto 20px;border:0;">
  <div style="background:#fff0cc;color:#754600;padding:15px;
       border-left:4px solid #d49a24;border-radius:6px;
       font-size:15px;font-weight:bold;line-height:1.6;">
    ${escapeHTML(safeText).replace(/\n/g, "<br>")}
  </div>
</div>`.trim();

    try {
        await navigator.clipboard.writeText(html);
        status.textContent = "HTML copied successfully!";
    } catch {
        const area = document.createElement("textarea");
        area.value = html;
        document.body.appendChild(area);
        area.select();

        try {
            const copied = document.execCommand("copy");
            status.textContent = copied
                ? "HTML copied successfully!"
                : "Copy failed. Please copy the HTML manually.";
        } catch {
            status.textContent = "Copy failed. Please copy the HTML manually.";
        }

        area.remove();
    }
});

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, function (char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[char];
    });
}

function escapeAttribute(value) {
    return escapeHTML(value);
}

resetButton.addEventListener("click", function () {
    gifUrlInput.value = defaultGif;
    customTextInput.value = "YOUR HIGHLIGHTED TEXT GOES HERE";
    headingInput.value = "Thank You!";
    updatePreview();
    status.textContent = "Default settings restored.";
});

gifImage.addEventListener("error", function () {
    status.textContent =
        "GIF could not load. Check the URL or use another publicly accessible GIF.";
});

updatePreview();
</script>

</body>
</html>
